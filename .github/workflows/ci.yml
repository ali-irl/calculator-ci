name: Python Calculator CI

# Trigger the pipeline on pushes or pull requests targeting the main branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-tests:
    # Spin up a fresh virtual machine hosted by GitHub
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone your repo files onto the virtual runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install Python onto the runner
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Step 3: Install project dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Execute the test suite
      - name: Run pytest
        run: |
          pytest