name: Calculator CI/CD Pipeline

on:
  push:
    branches: [ main ]

# Permissions required to create a GitHub Release
permissions:
  contents: write

jobs:
  # ==============================
  # 1. CI: Test Job
  # ==============================
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: pytest

  # ==============================
  # 2. CD: Build & Release Job
  # ==============================
  build-and-release:
    needs: run-tests # Only run if tests succeed!
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build Python package
        run: python -m build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: "Release v0.1.${{ github.run_number }}"
          body: "Automated release generated by GitHub Actions after passing all CI tests."
          files: dist/*